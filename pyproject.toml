[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "seestar-studio"
dynamic = ["version"]
description = "Native Windows multi-Seestar monitoring"
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-only"
dependencies = ["seestarpy[dashboard]==0.8.0", "PySide6==6.12.0", "numpy==2.5.4", "Pillow==13.0.0", "astropy==8.0.2", "winrt-runtime==3.2.1; sys_platform == 'win32'", "winrt-Windows.Devices.Geolocation==3.2.1; sys_platform == 'win32'", "winrt-Windows.Foundation==3.2.1; sys_platform == 'win32'", "winrt-Windows.Foundation.Collections==3.2.1; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pyinstaller==6.22.3"]

[project.gui-scripts]
seestar-studio = "seestar_studio.app:main"

[tool.setuptools.packages.find]
include = ["seestar_studio*"]

[tool.setuptools.package-data]
seestar_studio = ["catalog_data/*", "translations/*.json", "assets/*", "build_info.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.dynamic]
version = {attr = "seestar_studio.__version__"}
